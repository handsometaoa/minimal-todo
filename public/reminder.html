<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>待办到期提醒</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            :root {
                --r-accent: #fb7185;
                /* Fluent 亚克力质感：底色接近不透明保证在任意桌面背景上可读
                   （纯 CSS 无法真模糊桌面内容），玻璃感由描边、内高光与噪点承担 */
                --r-glass-bg: rgba(30, 33, 39, 0.93);
                --r-glass-border: rgba(255, 255, 255, 0.1);
                --r-glass-highlight: rgba(255, 255, 255, 0.12);
                --r-shadow: 0 2px 6px rgba(0, 0, 0, 0.28), 0 14px 32px rgba(0, 0, 0, 0.38);
                --r-text: rgba(255, 255, 255, 0.95);
                --r-muted: rgba(255, 255, 255, 0.55);
                --r-accent-strong: color-mix(in srgb, var(--r-accent) 72%, #ffffff);
                --r-hover-bg: rgba(255, 255, 255, 0.08);
                --r-item-bg: rgba(255, 255, 255, 0.045);
                --r-item-border: rgba(255, 255, 255, 0.06);
                --r-item-bg-hover: rgba(255, 255, 255, 0.085);
                --r-scrollbar: rgba(255, 255, 255, 0.16);
                --r-scrollbar-hover: rgba(255, 255, 255, 0.26);
            }
            :root[data-appearance='light'] {
                --r-glass-bg: rgba(247, 248, 251, 0.95);
                --r-glass-border: rgba(255, 255, 255, 0.65);
                --r-glass-highlight: rgba(255, 255, 255, 0.9);
                --r-shadow: 0 2px 6px rgba(15, 23, 42, 0.08), 0 14px 32px rgba(15, 23, 42, 0.16);
                --r-text: #1b2129;
                --r-muted: rgba(27, 33, 41, 0.55);
                --r-accent-strong: color-mix(in srgb, var(--r-accent) 58%, #16222e);
                --r-hover-bg: rgba(15, 23, 42, 0.06);
                --r-item-bg: rgba(15, 23, 42, 0.04);
                --r-item-border: rgba(15, 23, 42, 0.05);
                --r-item-bg-hover: rgba(15, 23, 42, 0.07);
                --r-scrollbar: rgba(15, 23, 42, 0.14);
                --r-scrollbar-hover: rgba(15, 23, 42, 0.24);
            }
            body {
                font-family:
                    'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
                background: transparent;
                overflow: hidden;
                padding: 10px;
                -webkit-font-smoothing: antialiased;
            }
            /* 卡片：亚克力底 + 顶部内高光 + 描边，噪点纹理由 ::before 叠加。
               注意：底色必须走 background-color 单值——多层 background 简写里
               中间层放 var() 颜色会令整个声明在计算时失效，卡片底色直接不渲染 */
            .reminder-card {
                position: relative;
                padding: 12px;
                border-radius: 12px;
                background-color: color-mix(in srgb, var(--r-accent) 5%, var(--r-glass-bg));
                background-image: linear-gradient(165deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0) 42%);
                border: 1px solid var(--r-glass-border);
                box-shadow:
                    inset 0 1px 0 var(--r-glass-highlight),
                    var(--r-shadow);
                animation: r-card-in 220ms cubic-bezier(0, 0.5, 0.2, 1) both;
            }
            .reminder-card::before {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: inherit;
                background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.55'/></svg>");
                background-size: 140px 140px;
                opacity: 0.032;
                pointer-events: none;
            }
            :root[data-appearance='light'] .reminder-card::before {
                opacity: 0.022;
            }
            .reminder-card__header {
                position: relative;
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 10px;
            }
            .reminder-card__title {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                font-size: 12px;
                font-weight: 600;
                letter-spacing: 0.02em;
                color: var(--r-text);
            }
            .reminder-card__icon {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 22px;
                height: 22px;
                border-radius: 6px;
                background: color-mix(in srgb, var(--r-accent) 16%, transparent);
                border: 1px solid color-mix(in srgb, var(--r-accent) 26%, transparent);
                color: var(--r-accent-strong);
            }
            .reminder-card__icon svg {
                width: 13px;
                height: 13px;
            }
            .reminder-card__count {
                margin-left: auto;
                padding: 2px 8px;
                border-radius: 999px;
                font-size: 10.5px;
                font-weight: 600;
                font-variant-numeric: tabular-nums;
                color: var(--r-accent-strong);
                background: color-mix(in srgb, var(--r-accent) 13%, transparent);
                border: 1px solid color-mix(in srgb, var(--r-accent) 22%, transparent);
            }
            .reminder-card__close,
            .reminder-item__dismiss {
                width: 26px;
                height: 26px;
                flex-shrink: 0;
                border: 0;
                border-radius: 6px;
                background: transparent;
                color: var(--r-muted);
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: 14px;
                line-height: 1;
                transition:
                    background 120ms ease,
                    color 120ms ease,
                    transform 120ms ease;
            }
            .reminder-card__close:hover,
            .reminder-item__dismiss:hover {
                background: var(--r-hover-bg);
                color: var(--r-text);
            }
            .reminder-card__close:active,
            .reminder-item__dismiss:active {
                transform: scale(0.94);
            }
            .reminder-card__close:focus-visible,
            .reminder-item__dismiss:focus-visible {
                outline: 2px solid var(--r-accent);
                outline-offset: 1px;
            }
            .reminder-card__list {
                position: relative;
                list-style: none;
                display: flex;
                flex-direction: column;
                gap: 6px;
                max-height: 246px;
                /* 入场动画的 translateX 会瞬时横向溢出，禁止横向滚动条闪现 */
                overflow-x: hidden;
                overflow-y: auto;
                overscroll-behavior: contain;
            }
            .reminder-item {
                position: relative;
                display: flex;
                align-items: flex-start;
                gap: 8px;
                padding: 9px 8px 9px 14px;
                border-radius: 8px;
                background: var(--r-item-bg);
                border: 1px solid var(--r-item-border);
                transition:
                    background 120ms ease,
                    border-color 120ms ease;
                animation: r-item-in 260ms cubic-bezier(0, 0.5, 0.2, 1) both;
            }
            .reminder-item:nth-child(2) {
                animation-delay: 40ms;
            }
            .reminder-item:nth-child(3) {
                animation-delay: 80ms;
            }
            .reminder-item:nth-child(4) {
                animation-delay: 120ms;
            }
            .reminder-item:nth-child(5) {
                animation-delay: 160ms;
            }
            .reminder-item:nth-child(n + 6) {
                animation-delay: 200ms;
            }
            .reminder-item:hover {
                background: var(--r-item-bg-hover);
                border-color: color-mix(in srgb, var(--r-accent) 22%, var(--r-item-border));
            }
            /* Fluent 通知式的强调条：左侧 3px 圆角竖条 */
            .reminder-item::before {
                content: '';
                position: absolute;
                left: 5px;
                top: 50%;
                transform: translateY(-50%);
                width: 3px;
                height: 56%;
                border-radius: 999px;
                background: color-mix(in srgb, var(--r-accent) 75%, transparent);
            }
            .reminder-item__main {
                flex: 1;
                min-width: 0;
                padding-top: 1px;
            }
            .reminder-item__text {
                font-size: 13px;
                line-height: 1.45;
                color: var(--r-text);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .reminder-item__due {
                display: block;
                margin-top: 3px;
                font-size: 11px;
                font-weight: 600;
                color: var(--r-accent-strong);
                font-variant-numeric: tabular-nums;
            }
            /* Fluent 细滚动条：默认细，悬停加粗 */
            .reminder-card__list::-webkit-scrollbar {
                width: 6px;
            }
            .reminder-card__list::-webkit-scrollbar-track {
                background: transparent;
            }
            .reminder-card__list::-webkit-scrollbar-thumb {
                border-radius: 999px;
                background: var(--r-scrollbar);
            }
            .reminder-card__list::-webkit-scrollbar-thumb:hover {
                background: var(--r-scrollbar-hover);
            }
            @keyframes r-card-in {
                from {
                    opacity: 0;
                    transform: translateY(8px) scale(0.985);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }
            @keyframes r-item-in {
                from {
                    opacity: 0;
                    transform: translateX(10px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .reminder-card,
                .reminder-item {
                    animation: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="reminder-card" role="alert">
            <div class="reminder-card__header">
                <span class="reminder-card__title">
                    <span class="reminder-card__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="9"></circle>
                            <polyline points="12 7 12 12 15 14"></polyline>
                        </svg>
                    </span>
                    待办到期
                </span>
                <span class="reminder-card__count" id="reminderCount" hidden aria-hidden="true"></span>
                <button class="reminder-card__close" id="closeAll" type="button" aria-label="关闭全部提醒">×</button>
            </div>
            <ul class="reminder-card__list" id="reminderList"></ul>
        </div>
        <script src="../src/scripts/reminder.js"></script>
    </body>
</html>
