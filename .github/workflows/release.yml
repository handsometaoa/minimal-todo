# 发布构建：打 tag（v*）或手动触发时，云端构建 Windows/macOS 安装包
# （macOS 安装包必须在 mac 上构建：better-sqlite3 为原生模块，产物与宿主系统绑定），
# 生成 SHA256 校验码，并自动创建 GitHub Release 挂载全部产物
name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            # npm ci 会触发 postinstall：electron-rebuild 将 better-sqlite3 对齐 Electron ABI
            - run: npm ci

            - name: Build installers (Windows)
              run: npx electron-builder --win --publish never

            - name: Upload installers
              uses: actions/upload-artifact@v4
              with:
                  name: installers-windows
                  path: |
                      dist/*.exe
                      dist/*.blockmap
                      dist/latest.yml
                  if-no-files-found: error

    # macOS（Apple Silicon）DMG：npm ci 触发 postinstall，electron-rebuild 将
    # better-sqlite3 对齐 Electron ABI（darwin-arm64）；无开发者证书，由 electron-builder
    # 的 identity: "-" 做 ad-hoc 签名（Apple Silicon 要求有效签名，否则启动即被内核 kill）
    build-mac:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - name: Build installers (macOS)
              run: npx electron-builder --mac --publish never

            - name: Upload installers
              uses: actions/upload-artifact@v4
              with:
                  name: installers-macos
                  path: |
                      dist/*.dmg
                      dist/latest-mac.yml
                  if-no-files-found: error

    # 汇总产物，统一生成 SHA256 校验码并创建 Release（仅 tag 触发时）
    release:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: [build, build-mac]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  merge-multiple: true

            - name: Generate SHA256 checksums
              run: |
                  cd artifacts
                  sha256sum --tag *.* > SHA256SUMS
                  cat SHA256SUMS

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: artifacts/*
                  generate_release_notes: true
