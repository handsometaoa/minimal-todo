# 发布构建：打 tag（v*）或手动触发时，云端构建 Windows / macOS 安装包，
# 生成 SHA256 校验码，并自动创建 GitHub Release 挂载全部产物
name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        strategy:
            matrix:
                os: [windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            # npm ci 会触发 postinstall：electron-rebuild 将 better-sqlite3 对齐 Electron ABI
            - run: npm ci

            - name: Build installers (Windows)
              if: matrix.os == 'windows-latest'
              run: npx electron-builder --win --publish never

            - name: Build installers (macOS)
              if: matrix.os == 'macos-latest'
              run: npx electron-builder --mac --publish never

            - name: Upload installers
              uses: actions/upload-artifact@v4
              with:
                  name: installers-${{ matrix.os }}
                  path: |
                      dist/*.exe
                      dist/*.dmg
                      dist/*.blockmap
                      dist/latest.yml
                  if-no-files-found: error

    # 汇总两平台产物，统一生成 SHA256 校验码并创建 Release
    release:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  merge-multiple: true

            - name: Generate SHA256 checksums
              run: |
                  cd artifacts
                  sha256sum --tag *.* > SHA256SUMS
                  cat SHA256SUMS

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: artifacts/*
                  generate_release_notes: true
